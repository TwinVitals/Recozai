name: recozai-dev
services:
  db:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_DB: recozai
      POSTGRES_USER: recozai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique development database password}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recozai -d recozai"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  backend:
    build: ../backend
    develop:
      watch:
        - action: rebuild
          path: ../backend/Dockerfile
        - action: rebuild
          path: ../backend/pom.xml
        - action: rebuild
          path: ../backend/src
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/recozai
      DATABASE_USER: recozai
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique development database password}
      SECURITY_EPOCH: ${SECURITY_EPOCH:?Set the deployment security epoch}
      RESTORE_GATE: ${RESTORE_GATE:-CLOSED}
      SECURE_COOKIES: "false"
      BIND_ADDRESS: 0.0.0.0
      APP_STAGE: development
      CUSTODIAN_PUBLIC_KEY: ${CUSTODIAN_PUBLIC_KEY:-}
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r status <&3; [[ \"$$status\" == 'HTTP/1.1 200 '* ]]"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
  web:
    build: ../frontend
    develop:
      watch:
        - action: rebuild
          path: ../frontend/Dockerfile
        - action: rebuild
          path: ../frontend/runtime-config.sh
        - action: rebuild
          path: ../frontend/nginx.conf
        - action: rebuild
          path: ../frontend/package.json
        - action: rebuild
          path: ../frontend/package-lock.json
        - action: rebuild
          path: ../frontend/angular.json
        - action: rebuild
          path: ../frontend/tsconfig.json
        - action: rebuild
          path: ../frontend/tsconfig.app.json
        - action: rebuild
          path: ../frontend/tsconfig.spec.json
        - action: rebuild
          path: ../frontend/src
        - action: rebuild
          path: ../frontend/public
    ports:
      - "127.0.0.1:${HTTP_PORT:-18081}:8080"
    environment:
      PRIMEUI_LICENSE_KEY: ${PRIMEUI_LICENSE_KEY:-}
    depends_on:
      backend: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
volumes:
  database:
