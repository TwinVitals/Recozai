server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    access_log off;
    location = /runtime-config.js {
        alias /tmp/runtime-config.js;
        default_type application/javascript;
        add_header Cache-Control no-store always;
    }
    location = /healthz { return 200 "ok\n"; }
    location /api/ {
        client_max_body_size 21m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_cache off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
