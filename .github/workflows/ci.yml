name: Foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./mvnw -B verify
        working-directory: backend
      - run: npm ci --no-audit --no-fund && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node scripts/e2e-fixture.mjs prepare
      - run: docker compose --env-file .secrets/e2e/compose.env -f deploy/compose.dev.yml -p recozai-ci config --quiet
      - run: docker compose --env-file .secrets/e2e/compose.env -f deploy/compose.dev.yml -p recozai-ci up --build --wait --wait-timeout 240
      - run: |
          node scripts/e2e-fixture.mjs grant
          docker compose --env-file .secrets/e2e/compose.env -f deploy/compose.dev.yml -p recozai-ci run --rm --no-deps --user "$(id -u):$(id -g)" -v "$PWD/.secrets/e2e:/operator" backend --spring.main.web-application-type=none --operator.grant-file=/operator/grant.txt --operator.output-file=/operator/challenge.txt
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose --env-file .secrets/e2e/compose.env -f deploy/compose.dev.yml -p recozai-ci down --volumes
